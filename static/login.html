<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · 深夜茶话会</title>
<link rel="icon" href="/forum/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#07080d; --panel:rgba(18,21,32,.82); --line:rgba(120,190,255,.16);
    --text:#e8eefc; --text-2:#9fb0cc; --text-3:#64748b;
    --cyan:#38e1ff; --pink:#ff5ea8; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    overflow:hidden;
  }
  .bg-grid{
    position:fixed; inset:0; pointer-events:none; opacity:.35;
    background-image:linear-gradient(rgba(120,190,255,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,190,255,.06) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
  }
  .bg-glow{
    position:fixed; inset:-20%; pointer-events:none;
    background:radial-gradient(circle at 22% 20%,rgba(56,225,255,.16),transparent 45%),
               radial-gradient(circle at 80% 76%,rgba(255,94,168,.14),transparent 48%);
    filter:blur(20px);
  }
  .card{
    position:relative; width:100%; max-width:392px; padding:34px 30px 28px;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:22px}
  .brand-mark{
    width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(135deg,rgba(56,225,255,.22),rgba(255,94,168,.22));
    border:1px solid var(--line); color:var(--cyan); font-size:16px;
  }
  .brand strong{display:block; font-size:15px; letter-spacing:.02em}
  .brand em{display:block; font-style:normal; font-size:10.5px; color:var(--text-3); letter-spacing:.22em}
  h1{margin:0 0 6px; font-size:19px; font-weight:600}
  .sub{margin:0 0 20px; font-size:12.5px; color:var(--text-2)}
  label{display:block; margin-bottom:14px}
  label > span{display:block; font-size:12px; color:var(--text-2); margin-bottom:6px}
  input{
    width:100%; padding:11px 13px; border-radius:11px; color:var(--text);
    background:rgba(9,12,20,.9); border:1px solid rgba(120,190,255,.18);
    font-size:14px; outline:none; transition:border-color .16s,box-shadow .16s;
  }
  input:focus{border-color:rgba(56,225,255,.55); box-shadow:0 0 0 3px rgba(56,225,255,.12)}
  button{
    width:100%; margin-top:6px; padding:11px 14px; border-radius:11px; cursor:pointer;
    font-size:14px; font-weight:600; color:#04121a; border:0;
    background:linear-gradient(135deg,#38e1ff,#79f0d0);
    transition:filter .16s,transform .16s;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.6; cursor:not-allowed}
  .msg{min-height:19px; margin:12px 0 0; font-size:12.5px; color:var(--danger)}
  .foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
        font-size:11.5px; color:var(--text-3); line-height:1.7}
  .foot a{color:var(--text-2); text-decoration:none}
  .foot a:hover{color:var(--cyan)}
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<main class="card">
  <div class="brand">
    <span class="brand-mark">✦</span>
    <span>
      <strong>深夜茶话会</strong>
      <em>深夜茶话会</em>
    </span>
  </div>

  <h1>登录</h1>
  <p class="sub">论坛与后台仅对已登录的站内成员开放。</p>

  <form id="login-form" autocomplete="on">
    <label>
      <span>用户名</span>
      <input name="username" id="username" autocomplete="username" required autofocus />
    </label>
    <label>
      <span>密码</span>
      <input name="password" id="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit" id="submit">登录</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <p class="foot">
    本站不开放注册，账号由管理员创建。忘记密码请联系站长重置。<br />
    <a href="/">← 返回AI项目广场</a>
  </p>
</main>

<script>
(function () {
  var form = document.getElementById('login-form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submit');

  function nextUrl() {
    var q = new URLSearchParams(location.search);
    var next = q.get('next') || '';
    // 只允许站内相对路径，杜绝开放重定向
    if (!next || next.charAt(0) !== '/' || next.charAt(1) === '/') return '/forum';
    return next;
  }

  // 已登录直接跳走，避免重复登录
  fetch('/api/auth/me', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.logged_in) location.replace(nextUrl()); })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { msg.textContent = '用户名和密码都要填'; return; }
    btn.disabled = true; btn.textContent = '登录中…'; msg.textContent = '';
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ username: username, password: password })
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; });
    }).then(function (j) {
      if (j && j.ok) { location.replace(nextUrl()); return; }
      msg.textContent = (j && j.error) || '登录失败';
      btn.disabled = false; btn.textContent = '登录';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }).catch(function () {
      msg.textContent = '网络异常，请稍后重试';
      btn.disabled = false; btn.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>

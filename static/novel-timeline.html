<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界线大事件 · 小说板块</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/novel.css">
<script src="/static/theme.js"></script>
</head>
<body class="nv-body" data-page="timeline">
<div class="nv-bg"></div>

<header class="nv-top">
  <a class="nv-brand" href="/novel"><i>书</i>小说板块</a>
  <nav class="nv-nav">
    <a href="/novel">全部小说</a>
    <a data-link="/novel/book/{id}" href="/novel">书籍详情</a>
    <a data-link="/novel/book/{id}/characters" href="/novel">角色列表</a>
    <a data-link="/novel/book/{id}/graph" href="/novel">关系网</a>
  </nav>
  <div class="nv-user" id="nv-user">…</div>
</header>

<main class="nv-wrap" id="nv-main">
  <div class="nv-crumb"><a href="/novel">小说书架</a> / <a data-link="/novel/book/{id}" href="/novel">书籍</a> / 世界线大事件</div>
  <h1 class="nv-h1" id="nv-title">世界线大事件</h1>
  <p class="nv-sub">共 <b id="nv-wevent-count">0</b> 条 · 按事件时间升序排列；上传章节时填写事件描述会自动进来</p>

  <div class="nv-card">
    <h2 class="nv-h2">时间线</h2>
    <div id="nv-wevents"><div class="nv-empty">加载中…</div></div>
  </div>

  <div class="nv-card">
    <h2 class="nv-h2">补录大事件</h2>
    <form id="nv-wevent-form" autocomplete="off">
      <div class="nv-grid2">
        <label class="nv-field">
          <span>事件发生时间 <em>文本，可为虚构纪年</em></span>
          <input class="nv-input" data-name="event_time" maxlength="64" placeholder="例如：帝国历 12 年·春" required>
        </label>
        <label class="nv-field">
          <span>来源章节 ID <em>可选</em></span>
          <input class="nv-input" data-name="chapter_id" type="number" min="1" step="1" placeholder="章节 ID">
        </label>
      </div>
      <label class="nv-field">
        <span>事件描述 <em>必填</em></span>
        <textarea class="nv-textarea" data-name="description" maxlength="2000" placeholder="世界层面发生了什么" required></textarea>
      </label>
      <div id="nv-wevent-err"></div>
      <div class="nv-actions">
        <button class="nv-btn primary" id="nv-wevent-submit" type="submit">写入时间线</button>
      </div>
    </form>
  </div>
</main>

<script src="/static/novel.js" defer></script>
</body>
</html>
